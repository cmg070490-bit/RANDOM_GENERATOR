<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <script src="app.js"></script>
  <title>Random generator</title>

  <!-- Fontawesome is our recomended library for icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
    integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous" />
</head>

<body>
  <div class="container text-center mt-5">
    <h1>OMG! You will not belive me but...</h1>

    <div class="d-flex justify-content-center align-items-center fs-4">
      <p class="ms-1" id="excuse1"> </p>
      <p class="ms-1" id="excuse2"> </p>
      <p class="ms-1" id="excuse3"> </p>
      <p class="ms-1" id="excuse4"> </p>
    </div>
  </div>
  <script>
    let who = ['The dog', 'My grandma', 'The mailman', 'My bird'];
    let action = ['ate', 'peed', 'crushed', 'broke'];
    let what = ['my homework', 'my phone', 'the car'];
    let when = ['before the class', 'when I was sleeping', 'while I was exercising', 'during my lunch', 'while I was praying'];

    document.getElementById("excuse1").textContent =
      who[Math.floor(Math.random() * who.length)];

    document.getElementById("excuse2").textContent =
      action[Math.floor(Math.random() * action.length)];

    document.getElementById("excuse3").textContent =
      what[Math.floor(Math.random() * what.length)];

    document.getElementById("excuse4").textContent =
      when[Math.floor(Math.random() * when.length)];
  </script>
